name: meson

on:
  push:
    branches:
      - main
      - dev
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Meson
        run: python -m pip install --upgrade meson ninja

      - name: Install linux dependencies
        if: matrix.name == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libglib2.0-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev

      - name: Setup MSVC
        if: matrix.name == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Release build type matches what the CMake CI exercises with
      # `ctest -C Release`; several unit tests are assert()-based.
      - name: Configure
        run: meson setup build --buildtype=release -Dbuild_tests=true

      - name: Compile
        run: meson compile -C build

      - name: Test
        run: meson test -C build --suite eui-neo --print-errorlogs

      - name: Install
        run: meson install -C build --destdir pkg
